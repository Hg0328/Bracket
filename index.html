<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 제주중앙여고 스포츠 주간 · 빅발리볼 대진표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --ink:#111827;
    --ink-2:#374151;
    --muted:#8b93a1;
    --line:#e6e8ec;
    --wire:#c9ced6;
    --bg:#f6f7f9;
    --card:#ffffff;
    --primary:#2f5bea;
    --primary-soft:#eaf0ff;
    --gold:#c9961a;
    --gold-soft:#fdf6e3;
    --danger:#d93025;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  header{max-width:1180px;margin:0 auto;padding:36px 16px 20px;text-align:center}
  header .eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
  header h1{margin:6px 0 0;font-size:clamp(24px,4vw,32px);font-weight:800;letter-spacing:-.03em}

  main{max-width:1180px;margin:0 auto 48px;padding:0 16px}

  .tabs{display:flex;width:max-content;margin:0 auto 16px;padding:4px;background:#eceef2;border-radius:12px}
  .tab{
    border:0;cursor:pointer;font:inherit;font-weight:700;font-size:15px;color:var(--muted);
    padding:9px 28px;border-radius:9px;background:transparent;transition:.15s;
  }
  .tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(17,24,39,.1)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  .panel{display:none}
  .panel.active{display:block}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .toolbar .right{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .panel-title,.sched-card h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink-2);font:inherit;font-size:13px;font-weight:600;
    padding:8px 12px;border-radius:8px;cursor:pointer;transition:.12s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--wire);color:var(--ink)}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.primary:hover{background:#000;color:#fff}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--danger)}
  .teamcount{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-right:4px}
  .teamcount input{width:54px;padding:7px 6px;border:1px solid var(--line);border-radius:8px;font:inherit;text-align:center;color:var(--ink)}

  .warn{font-size:13px;color:var(--danger);margin:8px 2px 0;font-weight:600}
  .warn:empty{display:none}

  .scroller{overflow-x:auto;padding:16px 0 4px;margin:0 -8px}
  .bracket{position:relative;margin:0 auto}
  .bracket svg{position:absolute;inset:0;overflow:visible}
  .bracket svg path{fill:none;stroke:var(--wire);stroke-width:1.6;stroke-linejoin:round}
  .bracket svg path.win{stroke:var(--primary);stroke-width:3}

  .gno{
    position:absolute;transform:translate(-50%,-50%);
    width:26px;height:26px;border-radius:50%;
    border:1.5px solid var(--wire);background:#fff;color:var(--ink-2);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;font-family:inherit;transition:.12s;
  }
  .gno:hover{border-color:var(--primary);color:var(--primary)}
  .gno.done{background:var(--primary);border-color:var(--primary);color:#fff}
  .gno.final{width:32px;height:32px;font-size:13px;border-color:var(--gold);color:var(--gold)}
  .gno.final.done,.gno.final:hover{background:var(--gold);border-color:var(--gold);color:#fff}

  .wchip{
    position:absolute;transform:translate(-50%,-50%);
    background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:12px;
    padding:2px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;
  }
  .champ{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap}
  .champ .name{
    display:inline-block;background:var(--gold);color:#fff;font-weight:800;
    padding:6px 14px;border-radius:8px;font-size:14px;
  }
  .champ .tbd{
    display:inline-block;font-size:12px;color:var(--gold);font-weight:700;
    padding:4px 10px;border:1px dashed var(--gold);border-radius:8px;background:var(--gold-soft)
  }

  .slot{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
  .slot .num{font-weight:700;font-size:12px;color:var(--muted)}
  .slot input{
    width:68px;padding:8px 4px;text-align:center;border:1px solid var(--line);border-radius:8px;
    font:inherit;font-weight:700;font-size:14px;color:var(--ink);background:#fff;transition:.12s;
  }
  .slot input::placeholder{color:#c8ccd3;font-weight:500}
  .slot input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .slot input.filled{background:#f8f9fb;border-color:var(--wire)}
  .slot input.dup{border-color:var(--danger);background:#fdecea;color:var(--danger)}
  .slot.flash input{animation:flash 1.2s ease 2}
  @keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(47,91,234,0)}50%{box-shadow:0 0 0 6px rgba(47,91,234,.3)}}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.18);text-align:center}
  .modal h2{margin:0 0 4px;font-size:18px;font-weight:800}
  .modal .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
  .vs{display:flex;align-items:stretch;gap:10px}
  .vs .opt{
    flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px 8px;cursor:pointer;
    font:inherit;font-weight:800;font-size:17px;color:var(--ink);transition:.12s
  }
  .vs .opt:hover{border-color:var(--primary);color:var(--primary)}
  .vs .opt.sel{border-color:var(--primary);background:var(--primary);color:#fff}
  .vs .mid{align-self:center;font-size:13px;font-weight:700;color:var(--muted)}
  .modal .actions{display:flex;gap:6px;justify-content:center;margin-top:18px}

  .draw-num{font-size:88px;font-weight:900;color:var(--ink);line-height:1;margin:12px 0 6px;font-variant-numeric:tabular-nums}
  .draw-num.rolling{color:#d3d7de}
  .draw-label{font-size:14px;color:var(--muted);margin-bottom:14px}
  .modal input.big{
    width:140px;padding:10px;text-align:center;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:18px;font-weight:800;color:var(--ink)
  }
  .modal input.big:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;
    opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .sched-card{margin-top:16px}
  .sched-card h2{margin-bottom:14px}
  .sched-wrap{overflow-x:auto}
  table.sched{table-layout:fixed;border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
  table.sched th,table.sched td{border-bottom:1px solid var(--line);padding:10px 6px;text-align:center;vertical-align:top}
  table.sched thead th{color:var(--muted);font-weight:700;font-size:13px;border-bottom:1px solid var(--wire)}
  table.sched thead th.fday{color:var(--gold)}
  table.sched tbody tr:last-child th,table.sched tbody tr:last-child td{border-bottom:0}
  table.sched tbody th{color:var(--ink);font-weight:800;white-space:nowrap;vertical-align:middle;width:92px;text-align:left;padding-left:4px}
  table.sched tbody th small{display:block;font-weight:600;color:var(--muted);font-size:12px}
  .m{
    display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 6px;margin:0 0 6px;
    cursor:pointer;font:inherit;text-align:center;transition:.12s
  }
  .m:last-child{margin-bottom:0}
  .m:hover{border-color:var(--primary)}
  .m .no{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px}
  .m.final .no{color:var(--gold)}
  .m .tm{display:block;font-weight:700;color:var(--ink);font-size:13px;line-height:1.35;word-break:keep-all}
  .m .tm .tbd{color:var(--muted);font-weight:500}
  .m .tm .w{color:var(--primary)}
  .m .tm .vs-sep{color:var(--muted);font-weight:500;font-size:12px;margin:0 2px}
  .m.done{background:#fafbff}
  .m.final{border-color:#ecd9a4;background:var(--gold-soft)}
  .none{color:#d3d7de;font-size:13px;display:block;padding-top:8px}
  div.m{cursor:default}
  div.m:hover{border-color:var(--line)}
  div.m.final:hover{border-color:#ecd9a4}

  /* read-only (student view) */
  .gno.ro{cursor:default}
  .gno.ro:hover{border-color:var(--wire);color:var(--ink-2);transform:translate(-50%,-50%)}
  .gno.ro.done:hover{border-color:var(--primary);background:var(--primary);color:#fff}
  .gno.final.ro:not(.done):hover{border-color:var(--gold);background:#fff;color:var(--gold)}
  .gno.final.ro.done:hover{background:var(--gold);border-color:var(--gold);color:#fff}
  .slot .cls{
    width:68px;padding:8px 4px;text-align:center;border:1px solid var(--line);border-radius:8px;
    font-weight:700;font-size:14px;color:var(--ink);background:#f8f9fb;min-height:37px;line-height:19px
  }
  .slot .cls.empty{background:#fff;color:#c8ccd3;font-weight:500}

  footer{text-align:center;padding:0 16px 32px;font-size:13px;color:var(--muted)}
  footer:empty{display:none}
  .linkbtn{border:0;background:none;font:inherit;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:2px 4px}
  .linkbtn:hover{color:var(--ink)}
  .admin-on{display:inline-block;color:var(--primary);font-weight:700;margin-right:6px}
  .modal form{display:flex;flex-direction:column;gap:8px;text-align:left}
  .modal form input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px}
  .modal form input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .adm-add{display:flex;gap:6px;margin-bottom:12px}
  .adm-add input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px}
  .adm-add input:focus{outline:none;border-color:var(--primary)}
  .adm-list{list-style:none;margin:0;padding:0;text-align:left;max-height:240px;overflow:auto;border-top:1px solid var(--line)}
  .adm-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;word-break:break-all}
  .adm-list li small{color:var(--muted);font-weight:600;white-space:nowrap}
  .adm-list .empty{color:var(--muted);justify-content:center}
  .modal .err{color:var(--danger);font-size:13px;font-weight:600;min-height:1em;text-align:center}

  @media (max-width:640px){
    header{padding:26px 16px 16px}
    .card{padding:16px}
    .tab{padding:8px 22px}
    .toolbar{flex-direction:column;align-items:flex-start}
    .toolbar .right{gap:5px}
    .btn{padding:7px 10px}
    .teamcount{width:100%;margin:0 0 2px}
  }

  /* print: both grades, one per page */
  @media print{
    @page{size:A4 landscape;margin:12mm}
    body{background:#fff}
    header{padding:0 0 8px}
    .tabs,.toolbar .right,.warn,footer{display:none!important}
    .sched-card{margin-top:0}
    .sched-wrap{overflow:visible}
    main{margin:0;max-width:none;padding:0}
    .card{border:0;padding:0}
    .panel{display:block!important;page-break-after:always}
    .scroller{overflow:visible}
    .slot input{border:1px solid #888;background:#fff!important;color:#000}
    .slot input:placeholder-shown{color:transparent}
    .gno,.wchip,.champ .name,.m.final{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">2026 제주중앙여고 스포츠 주간</div>
  <h1>빅발리볼 대진표</h1>
</header>

<main>
  <div class="tabs" role="tablist">
    <button class="tab active" data-g="g1">1학년</button>
    <button class="tab" data-g="g2">2학년</button>
  </div>

  <section class="panel card active" id="panel-g1"></section>
  <section class="panel card" id="panel-g2"></section>

  <section class="card sched-card" id="schedule"></section>
</main>

<footer id="adminbar"></footer>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<!-- Firebase (실시간 동기화 · 운영자 로그인) -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
/* Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)에서 복사한 값을 붙여 넣으세요.
   비워 두면 예전처럼 이 기기에만 저장되는 '로컬 모드'로 동작해요. */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyACxuWpyf9rAXk8NFVAvsyqXtZ3DZIp2Kg",
  authDomain: "sport-495c7.firebaseapp.com",
  databaseURL: "https://sport-495c7-default-rtdb.firebaseio.com",
  projectId: "sport-495c7",
  storageBucket: "sport-495c7.firebasestorage.app",
  messagingSenderId: "144696503834",
  appId: "1:144696503834:web:61c8d8bc34c4947b10eba3"
};
/* 대표 운영자 Gmail. 이 계정만 다른 운영자를 추가·삭제할 수 있어요.
   (Firebase 보안 규칙에도 같은 주소를 넣어야 실제로 지켜져요) */
var OWNER_EMAIL = "jungang2620920@onedu.jje.go.kr";
</script>
<script>
(function(){
  "use strict";

  var KEY = "jjgh-bigvolley-bracket-2026";
  var GRADES = { g1: { title: "1학년", defaultN: 12 }, g2: { title: "2학년", defaultN: 9 } };
  var MIN_N = 2, MAX_N = 32;

  /* ---------- state ---------- */
  function fresh(){
    return {
      g1: { n: GRADES.g1.defaultN, classes: {}, winners: {} },
      g2: { n: GRADES.g2.defaultN, classes: {}, winners: {} }
    };
  }
  function sanitize(s){
    var out = fresh();
    if (!s || typeof s !== "object") return out;
    ["g1","g2"].forEach(function(g){
      var src = s[g]; if (!src) return;
      var n = parseInt(src.n, 10);
      if (n >= MIN_N && n <= MAX_N) out[g].n = n;
      if (src.classes && typeof src.classes === "object") {
        Object.keys(src.classes).forEach(function(k){
          var i = parseInt(k,10);
          var v = src.classes[k];
          if (v != null && v !== "" && i>=1 && i<=out[g].n) out[g].classes[i] = String(v).slice(0,12);
        });
      }
      if (src.winners && typeof src.winners === "object") {
        Object.keys(src.winners).forEach(function(k){
          var v = src.winners[k];
          if (v === "L" || v === "R") out[g].winners[parseInt(k,10)] = v;
        });
      }
    });
    return out;
  }

  var state = fresh();
  var sharedLoaded = false;

  /* ---------- mode ----------
     로컬 모드: Firebase 설정이 비어 있으면 예전처럼 이 기기에 저장, 누구나 수정.
     온라인 모드: 모두가 같은 데이터를 실시간으로 보고, 로그인한 운영자만 수정. */
  var DB_PATH = "bracket2026";
  var dbMode = !!(window.FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL && window.firebase);
  var db = null, auth = null, adminUser = null;
  function canEdit(){ return !dbMode || !!adminUser; }

  // 1) shared link (#d=...) takes priority, 2) localStorage  (로컬 모드에서만)
  try {
    var m = !dbMode && location.hash.match(/[#&]d=([^&]+)/);
    if (m) {
      var json = decodeURIComponent(escape(atob(decodeURIComponent(m[1]))));
      state = sanitize(JSON.parse(json));
      sharedLoaded = true;
    }
  } catch(e) { /* ignore broken link */ }
  if (!sharedLoaded && !dbMode) {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) state = sanitize(JSON.parse(raw));
    } catch(e) {}
  }
  function save(){
    if (dbMode) {
      if (!adminUser) return;
      db.ref(DB_PATH).set(state).catch(function(){ toast("저장하지 못했어요. 운영자 권한을 확인해 주세요"); });
      return;
    }
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
  }

  /* ---------- bracket structure ---------- */
  // Balanced split: bigger half on the left, so byes sit on the right of each group (like the plan document).
  function buildTree(n){
    var slot = 0;
    function b(k, parent){
      if (k === 1) { return { leaf:true, slot:++slot, parent:parent }; }
      var node = { leaf:false, parent:parent };
      var a = Math.ceil(k/2);
      node.left = b(a, node);
      node.right = b(k-a, node);
      return node;
    }
    var root = b(n, null);
    var games = [];
    (function h(nd){
      if (nd.leaf) { nd.h = 0; return 0; }
      nd.h = Math.max(h(nd.left), h(nd.right)) + 1;
      games.push(nd); return nd.h;
    })(root);
    var li = 0;
    (function pos(nd){
      if (nd.leaf) { nd.x = li++; return; }
      pos(nd.left); pos(nd.right);
      nd.x = (nd.left.x + nd.right.x) / 2;
    })(root);
    // number games: earlier rounds first, then left → right (same as the plan document)
    games.sort(function(a,b){ return a.h - b.h || a.x - b.x; });
    var byId = {};
    games.forEach(function(g,i){ g.id = i+1; byId[g.id] = g; });
    return { root:root, games:games, byId:byId, height:root.h, n:n };
  }

  function classLabel(v){
    v = (v || "").trim();
    if (!v) return "";
    return /^\d+$/.test(v) ? v + "반" : v;
  }
  function teamOf(gs, node){
    if (node.leaf) {
      var l = classLabel(gs.classes[node.slot]);
      return { name: l || (node.slot + "번"), filled: !!l };
    }
    var w = gs.winners[node.id];
    if (!w) return null;
    return teamOf(gs, w === "L" ? node.left : node.right);
  }
  function clearAncestors(gs, node){
    var p = node.parent;
    while (p) { delete gs.winners[p.id]; p = p.parent; }
  }

  /* ---------- rendering ---------- */
  var trees = {};
  var SP = 84, PADX = 50, STEP = 62, TOP = 92, LEAF_H = 86;

  function renderPanel(g){
    var gs = state[g];
    var t = trees[g] = buildTree(gs.n);
    var panel = document.getElementById("panel-" + g);
    var W = PADX*2 + (gs.n - 1) * SP;
    var base = TOP + t.height * STEP;
    var H = base + LEAF_H;

    function px(nd){ return PADX + nd.x * SP; }
    function py(nd){ return nd.leaf ? base : base - nd.h * STEP; }

    var html = '';
    var edit = canEdit();
    html += '<div class="toolbar">' +
              '<h2 class="panel-title">' + GRADES[g].title + '</h2>' +
            (edit ? '<div class="right">' +
              '<label class="teamcount">팀 수 <input type="number" min="'+MIN_N+'" max="'+MAX_N+'" value="'+gs.n+'" data-act="n"></label>' +
              '<button class="btn primary" data-act="draw">번호 뽑기</button>' +
              (dbMode ? '' : '<button class="btn" data-act="share">공유</button>') +
              '<button class="btn" data-act="print">인쇄</button>' +
              '<button class="btn ghost" data-act="reset">초기화</button>' +
            '</div>' : '') + '</div>';
    html += '<div class="warn" id="warn-' + g + '"></div>';
    html += '<div class="scroller"><div class="bracket" style="width:'+W+'px;height:'+H+'px">';

    // lines
    var normal = [], win = [];
    t.games.forEach(function(gm){
      [["L", gm.left], ["R", gm.right]].forEach(function(pair){
        var c = pair[1];
        var d = "M" + px(c) + " " + py(c) + " V" + py(gm) + " H" + px(gm);
        (gs.winners[gm.id] === pair[0] ? win : normal).push(d);
      });
    });
    var champ = teamOf(gs, t.root);
    if (champ) win.push("M" + px(t.root) + " " + py(t.root) + " V" + (py(t.root) - 26));
    else normal.push("M" + px(t.root) + " " + py(t.root) + " V" + (py(t.root) - 26));

    html += '<svg width="'+W+'" height="'+H+'" aria-hidden="true">' +
      normal.map(function(d){ return '<path d="'+d+'"/>'; }).join("") +
      win.map(function(d){ return '<path class="win" d="'+d+'"/>'; }).join("") +
      '</svg>';

    // game number buttons + winner chips
    t.games.forEach(function(gm){
      var isFinal = gm === t.root;
      var done = !!gs.winners[gm.id];
      var title = isFinal ? "결승전" : (gm.id + "경기");
      var gpos = 'style="left:'+px(gm)+'px;top:'+(py(gm)+17)+'px"';
      if (edit) {
        html += '<button class="gno' + (isFinal?' final':'') + (done?' done':'') + '" data-game="'+gm.id+'" ' +
                gpos + ' title="'+title+' 결과 입력">' + gm.id + '</button>';
      } else {
        html += '<span class="gno ro' + (isFinal?' final':'') + (done?' done':'') + '" ' + gpos + ' title="'+title+'">' + gm.id + '</span>';
      }
      if (done && !isFinal) {
        var w = teamOf(gs, gm);
        html += '<span class="wchip" style="left:'+px(gm)+'px;top:'+(py(gm)-17)+'px">' + esc(w.name) + '</span>';
      }
    });

    // champion
    html += '<div class="champ" style="left:'+px(t.root)+'px;top:'+(py(t.root)-28)+'px">' +
            (champ ? '<div class="name">' + esc(champ.name) + ' 우승!</div>' : '<div class="tbd">우승</div>') +
            '</div>';

    // leaves
    var leaves = [];
    (function collect(nd){ if (nd.leaf) leaves.push(nd); else { collect(nd.left); collect(nd.right); } })(t.root);
    leaves.forEach(function(lf){
      var v = gs.classes[lf.slot] || "";
      var lbl = classLabel(v);
      html += '<div class="slot" id="slot-'+g+'-'+lf.slot+'" style="left:'+px(lf)+'px;top:'+(base+8)+'px">' +
                '<div class="num">' + lf.slot + '</div>' +
                (edit
                  ? '<input type="text" maxlength="12" inputmode="text" placeholder="○반" aria-label="'+lf.slot+'번 반" ' +
                      'data-slot="'+lf.slot+'" value="'+esc(v)+'">'
                  : '<div class="cls' + (lbl ? '' : ' empty') + '">' + (lbl ? esc(lbl) : '–') + '</div>') +
              '</div>';
    });

    html += '</div></div>';

    panel.innerHTML = html;
    refreshStatus(g);
    renderSchedule();
  }

  /* ---------- schedule ---------- */
  // 계획서 기준: 11월 23일부터 하루 2경기(코트 2개), 결승은 11월 28일.
  var START_DAY = 23, FINAL_DAY = 28, PER_DAY = 2;

  // 경기 번호 순서대로 하루 2경기씩 배치. 앞 경기 승자가 필요한 경기는 그 다음 날 이후로.
  function buildSchedule(t){
    var dayOf = {}, used = {}, cursor = 0, lastDay = 0;
    t.games.forEach(function(gm){
      if (gm === t.root) return;
      var min = 0;
      [gm.left, gm.right].forEach(function(c){ if (!c.leaf) min = Math.max(min, dayOf[c.id] + 1); });
      var d = Math.max(min, cursor);
      while ((used[d] || 0) >= PER_DAY) d++;
      dayOf[gm.id] = d; used[d] = (used[d] || 0) + 1; cursor = d; lastDay = Math.max(lastDay, d);
    });
    var finalIdx = FINAL_DAY - START_DAY;
    var hasOthers = t.games.length > 1;
    if (hasOthers && lastDay >= finalIdx) finalIdx = lastDay + 1;
    dayOf[t.root.id] = finalIdx;
    return dayOf;
  }

  function sideText(gs, node){
    if (node.leaf) {
      var l = classLabel(gs.classes[node.slot]);
      return l ? esc(l) : '<span class="tbd">' + node.slot + '번</span>';
    }
    var w = teamOf(gs, node);
    return w ? esc(w.name) : '<span class="tbd">' + node.id + '경기 승자</span>';
  }

  function renderSchedule(){
    if (!trees.g1 || !trees.g2) return;
    var rows = [
      { g:"g1", label:"1학년", sub:"1타임" },
      { g:"g2", label:"2학년", sub:"2타임" }
    ];
    var maxIdx = 0;
    rows.forEach(function(r){
      r.dayOf = buildSchedule(trees[r.g]);
      Object.keys(r.dayOf).forEach(function(k){ maxIdx = Math.max(maxIdx, r.dayOf[k]); });
    });
    var finals = rows.map(function(r){ return r.dayOf[trees[r.g].root.id]; });

    var h = '<h2>경기 일정</h2>' +
            '<div class="sched-wrap"><table class="sched"><thead><tr><th></th>';
    for (var d = 0; d <= maxIdx; d++) {
      var isF = finals.indexOf(d) >= 0;
      h += '<th' + (isF ? ' class="fday"' : '') + '>' + (START_DAY + d) + '일' + (isF ? ' · 결승' : '') + '</th>';
    }
    h += '</tr></thead><tbody>';
    rows.forEach(function(r){
      var t = trees[r.g], gs = state[r.g];
      h += '<tr><th>' + r.label + '<small>(' + r.sub + ')</small></th>';
      for (var d = 0; d <= maxIdx; d++) {
        var list = t.games.filter(function(gm){ return r.dayOf[gm.id] === d; });
        h += '<td>';
        if (!list.length) h += '<span class="none">–</span>';
        list.forEach(function(gm){
          var isFinal = gm === t.root, w = gs.winners[gm.id];
          var a = sideText(gs, gm.left), b = sideText(gs, gm.right);
          if (w === "L") a = '<span class="w">' + a + '</span>';
          if (w === "R") b = '<span class="w">' + b + '</span>';
          var tag = canEdit() ? 'button' : 'div';
          h += '<' + tag + ' class="m' + (isFinal ? ' final' : '') + (w ? ' done' : '') + '" data-sg="' + r.g + '" data-game="' + gm.id + '">' +
                 '<span class="no">' + (isFinal ? '결승 (' + gm.id + '경기) · 3판 2승' : gm.id + '경기') + '</span>' +
                 '<span class="tm">' + a + ' <span class="vs-sep">vs</span> ' + b + '</span>' +
               '</' + tag + '>';
        });
        h += '</td>';
      }
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    document.getElementById("schedule").innerHTML = h;
  }

  function refreshStatus(g){
    var gs = state[g], panel = document.getElementById("panel-" + g);
    var counts = {}, filled = 0;
    for (var i=1;i<=gs.n;i++){
      var l = classLabel(gs.classes[i]);
      if (l) { filled++; counts[l] = (counts[l]||0) + 1; }
    }
    var dups = Object.keys(counts).filter(function(k){ return counts[k] > 1; });
    panel.querySelectorAll(".slot input").forEach(function(inp){
      var l = classLabel(inp.value);
      inp.classList.toggle("filled", !!l);
      inp.classList.toggle("dup", !!l && counts[l] > 1);
    });
    document.getElementById("warn-" + g).textContent =
      dups.length ? "같은 반이 중복됐어요: " + dups.join(", ") : "";
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------- modal helpers ---------- */
  var overlay = document.getElementById("overlay"), modal = document.getElementById("modal");
  var drawTimer = null;
  function openModal(html){ modal.innerHTML = html; overlay.classList.add("show"); }
  function closeModal(){ overlay.classList.remove("show"); if (drawTimer) { clearInterval(drawTimer); drawTimer = null; } }
  overlay.addEventListener("click", function(e){ if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeModal(); });

  var toastEl = document.getElementById("toast"), toastT;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  /* ---------- game result ---------- */
  function openGame(g, id){
    if (!canEdit()) return;
    var gs = state[g], t = trees[g], gm = t.byId[id];
    var isFinal = gm === t.root;
    var A = teamOf(gs, gm.left), B = teamOf(gs, gm.right);
    var title = isFinal ? "결승전" : (id + "경기");
    if (!A || !B) {
      var need = [];
      if (!A) need.push(gm.left.id + "경기");
      if (!B) need.push(gm.right.id + "경기");
      openModal('<h2>' + title + '</h2><div class="sub">' + need.join(", ") +
        ' 결과를 먼저 입력해 주세요.</div><div class="actions"><button class="btn" data-m="close">확인</button></div>');
      return;
    }
    var cur = gs.winners[id];
    openModal('<h2>' + title + '</h2><div class="sub">' + (isFinal ? "3판 2승제 · " : "") + '이긴 반을 눌러 주세요</div>' +
      '<div class="vs">' +
        '<button class="opt' + (cur==="L"?" sel":"") + '" data-m="win" data-side="L">' + esc(A.name) + '</button>' +
        '<span class="mid">VS</span>' +
        '<button class="opt' + (cur==="R"?" sel":"") + '" data-m="win" data-side="R">' + esc(B.name) + '</button>' +
      '</div>' +
      '<div class="actions">' +
        (cur ? '<button class="btn ghost" data-m="clear">결과 지우기</button>' : '') +
        '<button class="btn" data-m="close">닫기</button></div>');
    modal.onclick = function(e){
      var b = e.target.closest("[data-m]"); if (!b) return;
      var act = b.getAttribute("data-m");
      if (act === "close") { closeModal(); return; }
      if (act === "win") {
        var side = b.getAttribute("data-side");
        if (gs.winners[id] !== side) { clearAncestors(gs, gm); gs.winners[id] = side; }
        save(); renderPanel(g); closeModal();
        var w = teamOf(gs, gm);
        toast(isFinal ? w.name + " 우승을 축하해요!" : id + "경기 승리: " + w.name);
      }
      if (act === "clear") {
        delete gs.winners[id]; clearAncestors(gs, gm);
        save(); renderPanel(g); closeModal();
      }
    };
  }

  /* ---------- number draw ---------- */
  function openDraw(g){
    var gs = state[g];
    var left = [];
    for (var i=1;i<=gs.n;i++) if (!classLabel(gs.classes[i])) left.push(i);
    if (!left.length) {
      openModal('<h2>번호 뽑기</h2><div class="sub">모든 번호에 반이 들어갔어요!</div>' +
        '<div class="actions"><button class="btn" data-m="close">확인</button></div>');
      modal.onclick = function(e){ if (e.target.closest('[data-m="close"]')) closeModal(); };
      return;
    }
    var pick = left[Math.floor(Math.random() * left.length)];
    openModal('<h2>' + GRADES[g].title + ' 번호 뽑기</h2>' +
      '<div class="sub">남은 번호 ' + left.length + '개 중에서 뽑아요</div>' +
      '<div class="draw-num rolling" id="drawNum">?</div>' +
      '<div class="draw-label" id="drawLabel">두구두구…</div>' +
      '<div id="drawForm" style="visibility:hidden">' +
        '<input class="big" id="drawInput" placeholder="몇 반?" maxlength="12">' +
        '<div class="actions"><button class="btn primary" data-m="ok">저장</button>' +
        '<button class="btn" data-m="again">다시 뽑기</button><button class="btn ghost" data-m="close">닫기</button></div>' +
      '</div>');
    var numEl = document.getElementById("drawNum"), ticks = 0;
    drawTimer = setInterval(function(){
      ticks++;
      numEl.textContent = left[Math.floor(Math.random()*left.length)];
      if (ticks >= 14) {
        clearInterval(drawTimer); drawTimer = null;
        numEl.textContent = pick; numEl.classList.remove("rolling");
        document.getElementById("drawLabel").textContent = pick + "번에 들어갈 반을 적어 주세요";
        document.getElementById("drawForm").style.visibility = "visible";
        var inp = document.getElementById("drawInput");
        inp.focus();
        inp.onkeydown = function(e){ if (e.key === "Enter") commit(); };
      }
    }, 70);
    function commit(){
      var v = document.getElementById("drawInput").value.trim();
      if (!v) { document.getElementById("drawInput").focus(); return; }
      gs.classes[pick] = v; save(); renderPanel(g); closeModal();
      var s = document.getElementById("slot-" + g + "-" + pick);
      if (s) { s.classList.add("flash"); s.scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"}); }
      toast(pick + "번 → " + classLabel(v));
    }
    modal.onclick = function(e){
      var b = e.target.closest("[data-m]"); if (!b) return;
      var a = b.getAttribute("data-m");
      if (a === "close") closeModal();
      if (a === "ok") commit();
      if (a === "again") { closeModal(); openDraw(g); }
    };
  }

  /* ---------- share ---------- */
  function shareLink(){
    var data = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    var url = location.href.split("#")[0] + "#d=" + encodeURIComponent(data);
    function fallback(){
      openModal('<h2>공유 링크</h2><div class="sub">아래 링크를 복사해서 보내 주세요</div>' +
        '<textarea id="shareTa" style="width:100%;height:90px;font-size:12px;border:1px solid #dde2ec;border-radius:10px;padding:8px" readonly>' + esc(url) + '</textarea>' +
        '<div class="actions"><button class="btn" data-m="close">닫기</button></div>');
      var ta = document.getElementById("shareTa"); ta.focus(); ta.select();
      modal.onclick = function(e){ if (e.target.closest('[data-m="close"]')) closeModal(); };
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(function(){
        toast("링크를 복사했어요! 열면 지금 대진표가 그대로 보여요");
      }, fallback);
    } else fallback();
  }

  /* ---------- events ---------- */
  document.querySelectorAll(".tab").forEach(function(tab){
    tab.addEventListener("click", function(){
      var g = tab.getAttribute("data-g");
      document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("active", x === tab); });
      document.querySelectorAll(".panel").forEach(function(p){ p.classList.toggle("active", p.id === "panel-" + g); });
    });
  });

  ["g1","g2"].forEach(function(g){
    var panel = document.getElementById("panel-" + g);

    panel.addEventListener("input", function(e){
      var inp = e.target;
      if (inp.matches(".slot input")) {
        var s = parseInt(inp.getAttribute("data-slot"), 10);
        var v = inp.value;
        if (v.trim()) state[g].classes[s] = v; else delete state[g].classes[s];
        save(); refreshStatus(g); renderSchedule();
      }
    });
    // re-render on blur so winner chips / champion pick up new names
    panel.addEventListener("change", function(e){
      if (e.target.matches(".slot input")) {
        var inp = e.target, v = inp.value.trim();
        if (/^\d+$/.test(v)) { // "3" → "3반"
          inp.value = v + "반";
          state[g].classes[parseInt(inp.getAttribute("data-slot"),10)] = inp.value;
          save(); refreshStatus(g);
        }
        if (Object.keys(state[g].winners).length) renderPanel(g);
      }
      if (e.target.matches('[data-act="n"]')) {
        var n = parseInt(e.target.value, 10);
        if (!(n >= MIN_N && n <= MAX_N)) { e.target.value = state[g].n; toast(MIN_N + "~" + MAX_N + "팀까지 가능해요"); return; }
        if (n === state[g].n) return;
        var has = Object.keys(state[g].classes).length || Object.keys(state[g].winners).length;
        if (has && !confirm("팀 수를 바꾸면 대진이 새로 짜여서 경기 결과가 지워져요. 계속할까요?")) {
          e.target.value = state[g].n; return;
        }
        state[g].n = n;
        Object.keys(state[g].classes).forEach(function(k){ if (+k > n) delete state[g].classes[k]; });
        state[g].winners = {};
        save(); renderPanel(g);
      }
    });
    panel.addEventListener("keydown", function(e){
      if (e.key === "Enter" && e.target.matches(".slot input")) {
        var s = parseInt(e.target.getAttribute("data-slot"), 10);
        var next = panel.querySelector('.slot input[data-slot="' + (s+1) + '"]');
        if (next) next.focus(); else e.target.blur();
      }
    });
    panel.addEventListener("click", function(e){
      var gb = e.target.closest(".gno");
      if (gb) { openGame(g, parseInt(gb.getAttribute("data-game"), 10)); return; }
      var b = e.target.closest("[data-act]"); if (!b) return;
      var a = b.getAttribute("data-act");
      if (a === "draw") openDraw(g);
      if (a === "share") shareLink();
      if (a === "print") window.print();
      if (a === "reset") {
        if (confirm(GRADES[g].title + " 대진표의 반 입력과 경기 결과를 모두 지울까요?")) {
          state[g].classes = {}; state[g].winners = {}; save(); renderPanel(g); toast("초기화했어요");
        }
      }
    });
  });

  document.getElementById("schedule").addEventListener("click", function(e){
    var b = e.target.closest("button.m"); if (!b) return;
    openGame(b.getAttribute("data-sg"), parseInt(b.getAttribute("data-game"), 10));
  });

  function renderAll(){ renderPanel("g1"); renderPanel("g2"); renderAdminBar(); }

  /* ---------- 운영자 (Google 로그인) ----------
     DB 구조: admins/{이메일의 '.'을 ','로 바꾼 값} = true  (Firebase 키에 '.'을 못 써서) */
  var adminbar = document.getElementById("adminbar");
  var isOwner = false;
  function emailKey(e){ return String(e).trim().toLowerCase().replace(/\./g, ","); }
  function keyEmail(k){ return String(k).replace(/,/g, "."); }

  function renderAdminBar(){
    if (!dbMode) { adminbar.innerHTML = ""; return; }
    adminbar.innerHTML = adminUser
      ? '<span class="admin-on">운영자 모드</span>' +
        (isOwner ? '<button class="linkbtn" data-a="manage">운영자 관리</button>' : '') +
        '<button class="linkbtn" data-a="logout">로그아웃</button>'
      : '<button class="linkbtn" data-a="login">운영자 로그인</button>';
  }
  adminbar.addEventListener("click", function(e){
    var b = e.target.closest("[data-a]"); if (!b) return;
    var a = b.getAttribute("data-a");
    if (a === "logout") { auth.signOut(); toast("로그아웃했어요"); }
    if (a === "login") googleLogin();
    if (a === "manage") openManage();
  });

  function googleLogin(){
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    auth.signInWithPopup(provider).catch(function(err){
      var c = err && err.code;
      if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") {
        auth.signInWithRedirect(provider);
      } else if (c !== "auth/popup-closed-by-user" && c !== "auth/cancelled-popup-request") {
        toast("로그인하지 못했어요. 크롬이나 사파리에서 다시 시도해 주세요");
      }
    });
  }

  // 로그인한 계정이 운영자인지 확인
  function checkAdmin(user){
    if (!user) { adminUser = null; isOwner = false; renderAll(); return; }
    var email = (user.email || "").toLowerCase();
    isOwner = !!OWNER_EMAIL && email === OWNER_EMAIL.trim().toLowerCase();
    if (isOwner) { adminUser = user; renderAll(); return; }
    db.ref("admins/" + emailKey(email)).once("value").then(function(snap){
      if (snap.val() === true) { adminUser = user; renderAll(); toast("운영자 모드로 전환했어요"); }
      else denied();
    }, denied);
    function denied(){
      adminUser = null; renderAll();
      toast(email + " 은(는) 운영자로 등록되지 않은 계정이에요");
      auth.signOut();
    }
  }

  // 대표 운영자 전용: Gmail로 운영자 추가·삭제
  function openManage(){
    if (!isOwner) return;
    var ref = db.ref("admins");
    openModal('<h2>운영자 관리</h2><div class="sub">추가한 Gmail 계정으로 로그인하면 결과를 수정할 수 있어요</div>' +
      '<form class="adm-add" id="admForm"><input type="email" id="admEmail" placeholder="example@gmail.com" required>' +
      '<button class="btn primary" type="submit">추가</button></form>' +
      '<ul class="adm-list" id="admList"><li class="empty">불러오는 중…</li></ul>' +
      '<div class="actions"><button class="btn" data-m="close">닫기</button></div>');
    var list = document.getElementById("admList");
    function draw(snap){
      var v = snap.val() || {};
      var rows = '<li><span>' + esc(OWNER_EMAIL) + '</span><small>대표</small></li>';
      Object.keys(v).filter(function(k){ return v[k] === true; }).sort().forEach(function(k){
        rows += '<li><span>' + esc(keyEmail(k)) + '</span><button class="btn ghost" data-del="' + esc(k) + '">삭제</button></li>';
      });
      list.innerHTML = rows;
    }
    function fail(){ list.innerHTML = '<li class="empty">목록을 불러오지 못했어요. 보안 규칙을 확인해 주세요</li>'; }
    ref.on("value", draw, fail);
    var prevClose = closeModal;
    closeModal = function(){ ref.off("value", draw); closeModal = prevClose; prevClose(); };
    document.getElementById("admForm").onsubmit = function(e){
      e.preventDefault();
      var inp = document.getElementById("admEmail"), em = inp.value.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { toast("이메일 주소를 확인해 주세요"); return; }
      if (em === OWNER_EMAIL.trim().toLowerCase()) { toast("대표 운영자는 이미 운영자예요"); return; }
      ref.child(emailKey(em)).set(true).then(function(){ inp.value = ""; toast(em + " 을(를) 운영자로 추가했어요"); },
        function(){ toast("추가하지 못했어요. 보안 규칙을 확인해 주세요"); });
    };
    modal.onclick = function(e){
      if (e.target.closest('[data-m="close"]')) { closeModal(); return; }
      var d = e.target.closest("[data-del]"); if (!d) return;
      var k = d.getAttribute("data-del");
      if (confirm(keyEmail(k) + " 을(를) 운영자에서 뺄까요?")) {
        ref.child(k).remove().then(function(){ toast("삭제했어요"); }, function(){ toast("삭제하지 못했어요"); });
      }
    };
  }

  if (dbMode) {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database(); auth = firebase.auth();
    auth.onAuthStateChanged(checkAdmin);
    auth.getRedirectResult().catch(function(){});
    db.ref(DB_PATH).on("value", function(snap){
      var next = sanitize(snap.val());
      if (JSON.stringify(next) === JSON.stringify(state)) return; // 내가 방금 저장한 값이면 다시 그리지 않음
      var nChanged = next.g1.n !== state.g1.n || next.g2.n !== state.g2.n;
      state = next;
      var a = document.activeElement;
      if (!nChanged && a && a.matches && a.matches(".slot input")) { // 입력 중이면 포커스 유지
        refreshStatus("g1"); refreshStatus("g2"); renderSchedule(); return;
      }
      renderAll();
    }, function(){ toast("대진표를 불러오지 못했어요"); });
  }

  renderAll();
  if (sharedLoaded) {
    save();
    history.replaceState(null, "", location.pathname + location.search);
    toast("공유받은 대진표를 불러왔어요");
  }
})();
</script>
</body>
</html>
